<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">MovieFlix</div>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primaryNavigation">
            <span class="menu-toggle-label">Menu</span>
            <span aria-hidden="true">☰</span>
        </button>

        <nav id="primaryNavigation">
            <a href="index.html">Home</a>
            <a href="index.html">Movies</a>
            <a href="index.html#discoverMovies" data-nav-target="discoverMovies">Genres</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="index.html#movieSearch" data-nav-target="movieSearch">Search</a>
        </nav>
        <div id="authNav" class="auth-nav" aria-live="polite"></div>
    </header>

    <main class="auth-page">
        <section class="auth-panel" aria-labelledby="loginTitle">
            <h1 id="loginTitle">Welcome back</h1>
            <p>Log in to manage your MovieFlix watchlist.</p>

            <form class="auth-form" id="loginForm">
                <label for="loginEmail">
                    Email
                    <input id="loginEmail" name="email" type="email" autocomplete="email" required>
                </label>
                <label for="loginPassword">
                    Password
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                </label>
                <button class="auth-submit" id="loginSubmit" data-auth-submit data-loading-label="Logging in..." type="submit">Log In</button>
            </form>
            <p class="auth-message" id="loginStatus" aria-live="polite"></p>
            <p class="auth-switch">New to MovieFlix? <a href="register.html">Create an account</a></p>
        </section>
    </main>

    <script type="module" src="auth.js"></script>
    <script type="module" src="nav.js"></script>
</body>
</html>
